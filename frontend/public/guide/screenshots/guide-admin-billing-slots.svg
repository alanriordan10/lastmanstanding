<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="390" height="844" fill="#07111f"/>
<circle cx="340" cy="40" r="95" fill="#172554" opacity="0.35"/>
<circle cx="48" cy="155" r="55" fill="#082f49" opacity="0.45"/>
<rect x="24" y="28" width="48" height="48" rx="14" fill="#151f31" stroke="#2b3a55" stroke-width="2"/><text x="84" y="60" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#f8fafc" text-anchor="start">Competition Slots</text><text x="84" y="84" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start">First free, then one slot per competition</text>
<rect x="24" y="108" width="342" height="114" rx="22" fill="#082f49" stroke="#0ea5e9" stroke-width="2"/><g transform="translate(209,128)"><rect x="0" y="0" width="137" height="30" rx="15" fill="#063344" stroke="#22d3ee" stroke-width="2"/><text x="68.5" y="19.68" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#a5f3fc" text-anchor="middle">Slot credits: 0</text></g><g transform="translate(44,128)"><g transform="translate(0,0)"><text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#67e8f9" text-anchor="start">CLUB BILLING</text></g><g transform="translate(0,24)"><text x="0" y="16.4" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#f8fafc" text-anchor="start">First competition is free</text></g><g transform="translate(0,56)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="start">Used once per club, for life.</text></g></g>
<rect x="24" y="238" width="342" height="175" rx="22" fill="#151f31" stroke="#2b3a55" stroke-width="2"/><g transform="translate(44,258)"><g transform="translate(0,0)"><text x="0" y="14.76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="start">Need another competition?</text></g><g transform="translate(0,29)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">Buy a one-time slot to unlock creation.</text></g><g transform="translate(0,57)"><rect x="0" y="0" width="302" height="48" rx="16" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/><text x="151" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#05202f" text-anchor="middle">Buy competition slot</text></g><g transform="translate(0,119)"><text x="0" y="11.049999999999999" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start">Opens Stripe Checkout in a secure window.</text></g></g>
<rect x="24" y="429" width="342" height="138" rx="22" fill="#101827" stroke="#223047" stroke-width="2"/><g transform="translate(44,449)"><g transform="translate(0,0)"><text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#cbd5e1" text-anchor="start">HOW CREDITS WORK</text></g><g transform="translate(0,24)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">1 purchase = 1 credit.</text></g><g transform="translate(0,52)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">1 competition created = 1 credit used.</text></g><g transform="translate(0,80)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="start">Credits never expire and stay with the</text></g></g>
<rect x="24" y="583" width="342" height="101" rx="22" fill="#241804" stroke="#b45309" stroke-width="2"/><g transform="translate(44,603)"><g transform="translate(0,0)"><text x="0" y="12" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" text-anchor="start">NOT THE SAME AS ENTRY FEES</text></g><g transform="translate(0,24)"><text x="0" y="11.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#fde68a" text-anchor="start">Slots are a platform fee. You still collect</text><text x="0" y="30.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#fde68a" text-anchor="start">player entry fees.</text></g></g>
<rect x="24" y="700" width="342" height="118" rx="22" fill="#151f31" stroke="#2b3a55" stroke-width="2"/><g transform="translate(44,720)"><g transform="translate(0,0)"><rect x="0" y="0" width="169" height="34" rx="17" fill="#052e1a" stroke="#16a34a" stroke-width="2"/><text x="84.5" y="22.04" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#bbf7d0" text-anchor="middle">Payment successful</text><rect x="0" y="44" width="185" height="34" rx="17" fill="#111827" stroke="#334155" stroke-width="2"/><text x="92.5" y="66.04" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#cbd5e1" text-anchor="middle">Cancelled: no charge</text></g></g>
</svg>
