server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers — applied to ALL responses (static + proxied) ─
    # Note: Strict-Transport-Security only takes effect on HTTPS. Include
    # it here so it's set when this same config is mounted behind TLS.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(self \"https://js.stripe.com\"), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' wss: https://api.stripe.com; frame-src 'self' https://js.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── Backend API proxy ──────────────────────────────────────────────
    # Match only requests that are genuine API calls.
    # Rules are tested in order; the first match wins.
    # We use exact-prefix matching on known API roots that will never
    # conflict with a frontend route (auth, admin, payments, club-admin,
    # notifications) plus a regex for competition API calls which always
    # contain a numeric id segment.

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /admin API calls always have at least one more segment (e.g. /admin/competitions)
    location /admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /club-admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /payments/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notifications/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /competitions API calls always start with /competitions/<number>
    # e.g. /competitions/1, /competitions/1/gameweeks/2/pick
    # Frontend routes are /competitions (no trailing slash, no id) — handled by try_files below
    location ~ ^/competitions/[0-9]+ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /competitions/upcoming, /competitions/my, /competitions/past, /competitions/clubs
    location ~ ^/competitions/(upcoming|my|past|clubs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Canonical host normalization ───────────────────────────────────
    # Keep a single indexable host to avoid duplicate canonical signals.
    if ($host = www.runlastmanstanding.com) {
        return 301 https://runlastmanstanding.com$request_uri;
    }

    # ── Public prerendered routes ──────────────────────────────────────
    # Normalize trailing slashes internally so crawlers see a single 200
    # response path for public pages without any external redirect chain.
    rewrite ^/(blog|guides)/$ /$1 last;
    rewrite ^/(faq|guide|services|pricing|contact|refund-policy|privacy|terms|login|signup|register-club|create-club|forgot-password)/$ /$1 last;
    rewrite ^/(blog|guides)/([^/]+)/$ /$1/$2 last;

    # ── Frontend SPA fallback ──────────────────────────────────────────
    # Everything else (including /competitions, /admin, /profile, etc.)
    # serves index.html so React Router handles the route.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
