server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Backend API proxy ──────────────────────────────────────────────
    # Match only requests that are genuine API calls.
    # Rules are tested in order; the first match wins.
    # We use exact-prefix matching on known API roots that will never
    # conflict with a frontend route (auth, admin, payments, club-admin,
    # notifications) plus a regex for competition API calls which always
    # contain a numeric id segment.

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /admin API calls always have at least one more segment (e.g. /admin/competitions)
    location /admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /club-admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /payments/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notifications/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /competitions API calls always start with /competitions/<number>
    # e.g. /competitions/1, /competitions/1/gameweeks/2/pick
    # Frontend routes are /competitions (no trailing slash, no id) — handled by try_files below
    location ~ ^/competitions/[0-9]+ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /competitions/upcoming, /competitions/my, /competitions/past, /competitions/clubs
    location ~ ^/competitions/(upcoming|my|past|clubs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Frontend SPA fallback ──────────────────────────────────────────
    # Everything else (including /competitions, /admin, /profile, etc.)
    # serves index.html so React Router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
