spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:lmspassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 0 disables leak detection. The fixture sync transaction can legitimately
      # run for >60s on larger datasets, which causes false positive leak warnings.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        options: -c idle_in_transaction_session_timeout=${DB_IDLE_IN_TX_TIMEOUT_MS:60000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:15000}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  mail:
    protocol: ${MAIL_PROTOCOL:smtp}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # Use OAuth2 user-info instead of OpenID ID-token validation. This avoids
            # production failures when Google JWK cert retrieval is blocked upstream.
            scope:
              - profile
              - email
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: ${JWT_SECRET:super-secret-jwt-key-change-in-production-min-256-bits-long!!}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

fixture:
  provider: ${FIXTURE_PROVIDER:football-data}
  live-sync:
    interval-ms: ${FIXTURE_LIVE_SYNC_INTERVAL_MS:300000}
  sync:
    interval-ms: ${FIXTURE_SYNC_INTERVAL_MS:900000}
    from-days: ${FIXTURE_SYNC_FROM_DAYS:2}
    to-days: ${FIXTURE_SYNC_TO_DAYS:10}
    world-cup-max-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MAX_FIXTURES_PER_GAMEWEEK:10}
    world-cup-min-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MIN_FIXTURES_PER_GAMEWEEK:6}
    split-zone: ${FIXTURE_SYNC_SPLIT_ZONE:Europe/Dublin}

gameweek:
  processing:
    interval-ms: ${GAMEWEEK_PROCESSING_INTERVAL_MS:300000}

football-data:
  api-key: ${FOOTBALL_DATA_API_KEY:c565137f0689452ca211e2ae468c8693}
  base-url: https://api.football-data.org/v4
  competition-code: PL          # Premier League
  # Cache TTLs (seconds)
  teams-cache-ttl: 86400        # 24 hours  – teams rarely change
  fixtures-cache-ttl: 86400     # 24 hours  – upcoming fixtures
  results-cache-ttl: 3600       # 1 hour    – recent results (after GW ends)
  live-cache-ttl: 300           # 5 minutes – in-play scores

odds:
  enabled: ${ODDS_ENABLED:false}
  api-key: ${ODDS_API_KEY:}
  base-url: ${ODDS_BASE_URL:https://api.the-odds-api.com/v4}
  sport: ${ODDS_SPORT:soccer_epl}
  sports:
    pl: ${ODDS_SPORT_PL:soccer_epl}
    wc: ${ODDS_SPORT_WC:soccer_fifa_world_cup}
  regions: ${ODDS_REGIONS:uk}
  markets: ${ODDS_MARKETS:h2h}
  odds-format: ${ODDS_FORMAT:decimal}
  date-format: ${ODDS_DATE_FORMAT:iso}
  sync-cron: "${ODDS_SYNC_CRON:0 0 */6 * * *}"
  quota-backoff-hours: ${ODDS_QUOTA_BACKOFF_HOURS:24}
  sync:
    from-days: ${ODDS_SYNC_FROM_DAYS:0}
    to-days: ${ODDS_SYNC_TO_DAYS:14}
    max-to-days: ${ODDS_SYNC_MAX_TO_DAYS:14}
    refresh-hours: ${ODDS_SYNC_REFRESH_HOURS:24}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_secret_key_here}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_your_stripe_publishable_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:eur}
  default-country: ${STRIPE_DEFAULT_COUNTRY:IE}
  platform-fee-enabled: ${STRIPE_PLATFORM_FEE_ENABLED:false}
  # Prefer percent for readability, e.g. 5 means 5%. BPS remains supported, e.g. 500 means 5%.
  platform-fee-percent: ${STRIPE_PLATFORM_FEE_PERCENT:0}
  platform-fee-bps: ${STRIPE_PLATFORM_FEE_BPS:0}
  connect:
    return-url: ${STRIPE_CONNECT_RETURN_URL:https://runlastmanstanding.com/stripe-connect/return}
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL:https://runlastmanstanding.com/stripe-connect/return}
  slot:
    success-url: ${STRIPE_SLOT_SUCCESS_URL:https://runlastmanstanding.com/club-admin?billing=success}
    cancel-url: ${STRIPE_SLOT_CANCEL_URL:https://runlastmanstanding.com/club-admin?billing=cancel}
    price-id: ${STRIPE_SLOT_PRICE_ID:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Public links embedded in email must never point at a developer machine.
  public-url: ${PUBLIC_APP_URL:https://runlastmanstanding.com}
  mobile-oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:lastmanstanding://oauth2/callback}
  mail-from: ${MAIL_FROM:noreply@runlastmanstanding.com}
  mail-reply-to: ${MAIL_REPLY_TO:support@runlastmanstanding.com}
  mail-enabled: ${MAIL_ENABLED:false}
  resend-api-key: ${RESEND_API_KEY:}
  support-email: ${SUPPORT_EMAIL:support@runlastmanstanding.com}
  perf:
    endpoint-metrics-enabled: ${ENDPOINT_METRICS_ENABLED:true}
  vapid-public-key: ${VAPID_PUBLIC_KEY:}
  vapid-private-key: ${VAPID_PRIVATE_KEY:}
  vapid-subject: ${VAPID_SUBJECT:}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,text/html,text/plain,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Logging useful for debugging mail problems — can be toggled via env or runtime args
logging:
  level:
    org.springframework.mail: ${LOG_MAIL_LEVEL:DEBUG}
    jakarta.mail: ${LOG_JAKARTA_MAIL_LEVEL:DEBUG}
