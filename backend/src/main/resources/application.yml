spring:
  datasource:
    url: ${DB_URL}
    username: postgres.upxwggogevpziplqqjvv
    password: ${DB_PASSWORD:lmspassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 0 disables leak detection. The fixture sync transaction can legitimately
      # run for >60s on larger datasets, which causes false positive leak warnings.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        options: -c idle_in_transaction_session_timeout=${DB_IDLE_IN_TX_TIMEOUT_MS:60000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:15000}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  mail:
    protocol: ${MAIL_PROTOCOL:smtp}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      debug: ${MAIL_DEBUG:true}
    test-connection: ${MAIL_TEST_CONNECTION:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET:super-secret-jwt-key-change-in-production-min-256-bits-long!!}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

fixture:
  provider: ${FIXTURE_PROVIDER:football-data}
  sync-cron: "0 */15 * * * *"
  sync:
    from-days: ${FIXTURE_SYNC_FROM_DAYS:2}
    to-days: ${FIXTURE_SYNC_TO_DAYS:10}
    world-cup-max-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MAX_FIXTURES_PER_GAMEWEEK:10}
    world-cup-min-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MIN_FIXTURES_PER_GAMEWEEK:6}
    split-zone: ${FIXTURE_SYNC_SPLIT_ZONE:Europe/Dublin}

football-data:
  api-key: ${FOOTBALL_DATA_API_KEY:c565137f0689452ca211e2ae468c8693}
  base-url: https://api.football-data.org/v4
  competition-code: PL          # Premier League
  # Cache TTLs (seconds)
  teams-cache-ttl: 86400        # 24 hours  – teams rarely change
  fixtures-cache-ttl: 86400     # 24 hours  – upcoming fixtures
  results-cache-ttl: 3600       # 1 hour    – recent results (after GW ends)
  live-cache-ttl: 300           # 5 minutes – in-play scores

odds:
  enabled: ${ODDS_ENABLED:false}
  api-key: ${ODDS_API_KEY:}
  base-url: ${ODDS_BASE_URL:https://api.the-odds-api.com/v4}
  sport: ${ODDS_SPORT:soccer_epl}
  regions: ${ODDS_REGIONS:uk}
  markets: ${ODDS_MARKETS:h2h}
  odds-format: ${ODDS_FORMAT:decimal}
  date-format: ${ODDS_DATE_FORMAT:iso}
  sync-cron: "${ODDS_SYNC_CRON:0 */20 * * * *}"
  sync:
    from-days: ${ODDS_SYNC_FROM_DAYS:0}
    to-days: ${ODDS_SYNC_TO_DAYS:14}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_stripe_secret_key_here}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_your_stripe_publishable_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  platform-fee-bps: ${STRIPE_PLATFORM_FEE_BPS:0}
  connect:
    return-url: ${STRIPE_CONNECT_RETURN_URL:https://runlastmanstanding.com/stripe-connect/return}
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL:https://runlastmanstanding.com/stripe-connect/return}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mobile-oauth-callback-url: ${MOBILE_OAUTH_CALLBACK_URL:lastmanstanding://oauth2/callback}
  mail-from: ${MAIL_FROM:noreply@lastmanstanding.com}
  mail-enabled: ${MAIL_ENABLED:false}
  support-email: ${SUPPORT_EMAIL:alanriordan10@gmail.com}
  perf:
    endpoint-metrics-enabled: ${ENDPOINT_METRICS_ENABLED:true}
  vapid-public-key: ${VAPID_PUBLIC_KEY:}
  vapid-private-key: ${VAPID_PRIVATE_KEY:}
  vapid-subject: ${VAPID_SUBJECT:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Logging useful for debugging mail problems — can be toggled via env or runtime args
logging:
  level:
    org.springframework.mail: ${LOG_MAIL_LEVEL:DEBUG}
    jakarta.mail: ${LOG_JAKARTA_MAIL_LEVEL:DEBUG}
