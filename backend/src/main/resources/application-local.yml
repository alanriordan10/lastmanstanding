spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/lastmanstanding}
    username: ${LOCAL_DB_USERNAME:lmsuser}
    password: ${LOCAL_DB_PASSWORD:lmspassword}
  mail:
    test-connection: false

fixture:
  provider: ${FIXTURE_PROVIDER:football-data}
  live-sync:
    interval-ms: ${FIXTURE_LIVE_SYNC_INTERVAL_MS:300000}
  sync:
    interval-ms: ${FIXTURE_SYNC_INTERVAL_MS:900000}
    from-days: ${FIXTURE_SYNC_FROM_DAYS:2}
    to-days: ${FIXTURE_SYNC_TO_DAYS:10}
    world-cup-max-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MAX_FIXTURES_PER_GAMEWEEK:10}
    world-cup-min-fixtures-per-gameweek: ${FIXTURE_SYNC_WORLD_CUP_MIN_FIXTURES_PER_GAMEWEEK:6}
    split-zone: ${FIXTURE_SYNC_SPLIT_ZONE:Europe/Dublin}

football-data:
  api-key: ${FOOTBALL_DATA_API_KEY:c565137f0689452ca211e2ae468c8693}
  base-url: https://api.football-data.org/v4
  competition-code: PL          # Premier League
  # Cache TTLs (seconds)
  teams-cache-ttl: 86400        # 24 hours  – teams rarely change
  fixtures-cache-ttl: 86400     # 24 hours  – upcoming fixtures
  results-cache-ttl: 3600       # 1 hour    – recent results (after GW ends)
  live-cache-ttl: 300

odds:
  enabled: false

stripe:
  slot:
    success-url: ${LOCAL_STRIPE_SLOT_SUCCESS_URL:http://localhost:5173/club-admin?billing=success}
    cancel-url: ${LOCAL_STRIPE_SLOT_CANCEL_URL:http://localhost:5173/club-admin?billing=cancel}
  demo-success-url: ${LOCAL_STRIPE_DEMO_SUCCESS_URL:http://localhost:5173/services}
  demo-cancel-url: ${LOCAL_STRIPE_DEMO_CANCEL_URL:http://localhost:5173/services}

app:
  frontend-url: ${LOCAL_FRONTEND_URL:http://localhost:5173}
  public-url: ${LOCAL_PUBLIC_APP_URL:http://localhost:5173}
  mail-from: ${LOCAL_MAIL_FROM:noreply@runlastmanstanding.com}
  mail-reply-to: ${LOCAL_MAIL_REPLY_TO:support@runlastmanstanding.com}
  mail-enabled: ${LOCAL_MAIL_ENABLED:false}
  support-email: ${LOCAL_SUPPORT_EMAIL:support@runlastmanstanding.com}
  perf:
    endpoint-metrics-enabled: ${LOCAL_ENDPOINT_METRICS_ENABLED:false}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
