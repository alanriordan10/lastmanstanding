services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-lastmanstanding}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-lmsuser}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-lmspassword}
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - lms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME:-lmsuser} -d ${LOCAL_DB_NAME:-lastmanstanding}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: lms-backend
    profiles: ["app"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      LOCAL_DB_URL: jdbc:postgresql://postgres:5432/${LOCAL_DB_NAME:-lastmanstanding}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME:-lmsuser}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-lmspassword}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-min-256-bits-long!!}
      FRONTEND_URL: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
      LOCAL_FIXTURE_PROVIDER: mock
      LOCAL_MAIL_ENABLED: "false"
      ODDS_ENABLED: "false"

  frontend:
    build: ./frontend
    container_name: lms-frontend
    profiles: ["app"]
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  lms-postgres-data:
