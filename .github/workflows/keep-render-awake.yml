name: Keep Render Awake

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping lightweight health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DEFAULT_HEALTHCHECK_URL: https://lastmanstanding-xt19.onrender.com/actuator/health
        run: |
          URL="${HEALTHCHECK_URL:-$DEFAULT_HEALTHCHECK_URL}"
          echo "Pinging $URL"

          for attempt in 1 2 3; do
            if curl -fsS --retry 2 --retry-delay 5 --max-time 25 "$URL" >/dev/null; then
              echo "Health check succeeded on attempt $attempt"
              exit 0
            fi
            echo "Health check failed on attempt $attempt"
            sleep 10
          done

          echo "Health check failed after 3 attempts"
          exit 1
